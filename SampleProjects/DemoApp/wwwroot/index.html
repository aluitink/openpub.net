<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActivityPub Debug Console</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ActivityPub Debug Console</h1>
        <nav>
            <button onclick="showSection('keys')">Keys</button>
            <button onclick="showSection('actors')">Actors</button>
            <button onclick="showSection('activities')">Activities</button>
            <button onclick="showSection('templates')">Templates</button>
            <button onclick="showSection('status')">Status</button>
        </nav>
    </header>

    <main>
        <section id="keys" class="hidden">
            <h2>Generate RSA Key Pair</h2>
            <button id="generateKeysBtn">Generate Keys</button>
            <div id="keysResult" class="result-box"></div>
        </section>

        <section id="actors" class="hidden">
            <h2>Actor Management</h2>
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="Enter username">
                <button id="createActorBtn">Create Actor</button>
            </div>
            <h3>Existing Actors</h3>
            <div id="actorsList" class="result-box"></div>
        </section>

        <section id="activities" class="hidden">
            <h2>Submit Activity</h2>
            <div class="form-group">
                <label for="activityId">Activity ID:</label>
                <input type="text" id="activityId" placeholder="Enter activity ID">
            </div>
            <div class="form-group">
                <label for="jsonData">JSON Data:</label>
                <textarea id="jsonData" rows="4" placeholder='{"type":"Create","content":"Hello"}'></textarea>
            </div>
            <button id="submitActivityBtn">Submit Activity</button>
            <div id="activitiesResult" class="result-box"></div>
            
            <h3>Activity Stream</h3>
            <div id="activityStream" class="result-box"></div>
            <div class="pagination-controls">
                <button id="prevPageBtn">Previous</button>
                <span id="pageInfo">Page 1</span>
                <button id="nextPageBtn">Next</button>
            </div>
        </section>

        <section id="templates" class="hidden">
            <h2>ActivityPub Message Templates</h2>
            <div class="form-group">
                <label for="templateSelect">Select Template:</label>
                <select id="templateSelect">
                    <option value="">-- Select a template --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="templateContent">Template JSON:</label>
                <textarea id="templateContent" rows="10" readonly></textarea>
            </div>
            <div class="button-group">
                <button id="loadTemplateBtn">Load Template</button>
                <button id="copyTemplateBtn">Copy to Clipboard</button>
                <button id="submitFromTemplateBtn">Submit Activity</button>
            </div>
            <div id="templateResult" class="result-box"></div>
        </section>

        <section id="status" class="hidden">
            <h2>Service Status</h2>
            <button id="statusBtn">Check Status</button>
            <div id="statusResult" class="result-box"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
