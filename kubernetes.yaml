apiVersion: apps/v1
kind: Deployment
metadata:
  name: activitypub
  labels:
    app: activitypub
spec:
  replicas: 3
  selector:
    matchLabels:
      app: activitypub
  template:
    metadata:
      labels:
        app: activitypub
    spec:
      containers:
      - name: activitypub
        image: activitypub:latest
        ports:
        - containerPort: 80
        env:
        - name: ACTIVITYPUB_DOMAIN
          valueFrom:
            configMapKeyRef:
              name: activitypub-config
              key: domain
        - name: DATABASE_CONNECTION
          valueFrom:
            secretKeyRef:
              name: activitypub-secrets
              key: database-connection
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: activitypub-data
---
apiVersion: v1
kind: Service
metadata:
  name: activitypub
spec:
  selector:
    app: activitypub
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: activitypub
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: activitypub.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: activitypub
            port:
              number: 80
